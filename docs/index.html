<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071218">
<meta name="application-version" content="0.1.2.7">
<title>SWARMWAR</title>
<style>:root{
  color-scheme:dark;--bg:#071218;--paper:#e8f6f2;--muted:#9db5ba;--faint:#65858a;--edge:#79b7bb38;--cyan:#92f8eb;--gold:#ffd487;--salmon:#ff867f;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;--sans:system-ui,-apple-system,sans-serif;
  --top:max(15px,env(safe-area-inset-top));--left:max(16px,env(safe-area-inset-left));--right:max(16px,env(safe-area-inset-right));--bottom:max(13px,env(safe-area-inset-bottom));
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--paper);font-family:var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}
#game{position:fixed;inset:0;isolation:isolate;overflow:hidden;background:var(--bg)}
#game:fullscreen{width:100%;height:100%}
#game:-webkit-full-screen{width:100%;height:100%}
#canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;user-select:none}
#game[data-page="playing"] #canvas{cursor:crosshair}
.hurt{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,#fb626200 43%,#f3414880 100%);mix-blend-mode:screen}
.micro{font:700 10px/1.25 var(--mono);letter-spacing:.13em;text-transform:uppercase}
.utility{position:absolute;z-index:8;right:var(--right);top:var(--top);display:flex;gap:5px}
.icon-button{min-width:34px;min-height:34px;display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--edge);background:#07131eea;padding:0 9px;color:#c7dcdc;font:700 9px/1 var(--mono);letter-spacing:.08em;white-space:nowrap}
.icon-button svg{width:14px;height:14px;flex:none}
.icon-button:hover{color:var(--cyan);border-color:var(--cyan);background:#1c363f}
.icon-button:active{background:#29484d}
.utility-message{position:absolute;z-index:9;top:calc(var(--top) + 43px);right:var(--right);max-width:min(320px,85vw);padding:8px 10px;border:1px solid var(--edge);background:#08161ef5;color:var(--paper);font:11px/1.4 var(--mono)}
.flight{position:absolute;inset:0;z-index:2;pointer-events:none;user-select:none}
.mission{position:absolute;top:var(--top);left:var(--left);padding:10px 15px 11px 11px;background:linear-gradient(120deg,#07131eeb 45%,#07131e95);border-left:2px solid #8ce3dcb3;min-width:186px;max-width:min(290px,64vw)}
.mission .micro{display:flex;align-items:center;gap:8px;color:#bdd5d7;white-space:nowrap}
.separator{width:4px;height:4px;background:#84d9d0;rotate:45deg;display:inline-block}
.mission time{color:var(--cyan);font-variant-numeric:tabular-nums}
.mission strong{display:block;font-size:clamp(14px,1.45vw,21px);letter-spacing:.055em;line-height:1.04;margin:5px 0 8px;font-weight:850}
.wave{display:flex;align-items:center;gap:8px;color:var(--muted);font:700 9px/1 var(--mono);letter-spacing:.08em;white-space:nowrap}
#wavePips{display:flex;gap:3px;align-items:center}
#wavePips i{height:5px;width:12px;background:#45606a}
#wavePips i:last-child{width:6px;height:6px;rotate:45deg;margin-left:2px}
#wavePips .past{background:#60aaa5}
#wavePips .now{background:#b9fff4;box-shadow:0 0 8px #9dffee90}
.hud-panel{background:#08151eef;border:1px solid #8eb7bf40;color:var(--paper)}
.boss{position:absolute;top:var(--top);left:50%;translate:-50% 0;width:min(430px,33vw);padding:8px 10px;border-top:2px solid #f9918dc8}
.boss>div:first-child{display:flex;justify-content:space-between;gap:8px;font:700 10px/1 var(--mono);letter-spacing:.10em;color:#ffc0ae;margin-bottom:7px}
.boss #bossPhase{color:#f798a5;font-size:9px;white-space:nowrap}
.meter{height:4px;background:#223b46;overflow:hidden}
.meter i{display:block;width:100%;height:100%;background:var(--cyan);transform-origin:left center}
.boss .meter i{background:linear-gradient(90deg,#ff9b91,#f85574)}
.tactical{position:absolute;left:50%;translate:-50% 0;top:calc(var(--top) + 49px);display:flex;align-items:center;gap:8px;min-height:32px;max-width:80vw;width:max-content;padding:6px 11px;border-left:2px solid var(--gold);font:11px/1.35 var(--mono);box-shadow:0 4px 16px #06101755}
.tactical .micro{font-size:9px;letter-spacing:.11em;color:var(--gold);white-space:nowrap}
.tactical strong{color:var(--gold);font-size:12px;white-space:nowrap}
.tactical span:last-child{color:#dfebeb}
.tactical.hold{border-left-color:var(--cyan)}
.tactical.hold .micro,.tactical.hold strong{color:var(--cyan)}
.tactical.evade{border-left-color:var(--salmon);background:#2e1621f5}
.tactical.evade .micro,.tactical.evade strong{color:#ffaaa4}
.announcement{position:absolute;left:50%;top:23%;translate:-50% 0;text-align:center;max-width:min(85%,640px);min-width:min(300px,80vw);text-shadow:0 2px 14px #070c16,0 2px 8px #02060a}
.announcement .micro{color:var(--cyan);margin-bottom:5px}
.announcement strong{display:block;font-weight:950;font-size:clamp(22px,4vw,52px);letter-spacing:-.045em;line-height:.93}
.announcement span{display:block;margin-top:8px;color:#d8e7e9;font:12px/1.4 var(--mono)}
.hint{position:absolute;left:50%;bottom:calc(var(--bottom) + 115px);translate:-50% 0;width:max-content;max-width:88vw;padding:6px 10px;border-left:2px solid var(--cyan);color:#d4eceb;font:11px/1.4 var(--mono);text-align:center}
.dock{position:absolute;bottom:var(--bottom);left:50%;translate:-50% 0;width:min(750px,calc(100vw - var(--left) - var(--right)));display:grid;gap:5px}
.readout{display:flex;align-items:center;gap:0;min-height:30px;background:#07141ded;border:1px solid var(--edge);backdrop-filter:blur(6px)}
.hull{flex:1;max-width:260px;padding:5px 10px;min-width:110px}
.hull>div:first-child{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}
.readout span{color:var(--muted);font:700 9px/1 var(--mono);letter-spacing:.09em}
.readout strong{color:var(--paper);font:700 12px/1 var(--mono);font-variant-numeric:tabular-nums}
.count{display:flex;align-items:center;gap:7px;border-left:1px solid var(--edge);padding:5px 10px}
.count #droneCount{color:var(--cyan)}
.support{margin-left:auto;padding:0 9px;color:#ddfa90;font:700 9px/1.2 var(--mono);letter-spacing:.07em;white-space:nowrap}
.formations{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.formation{pointer-events:auto;display:grid;grid-template-columns:24px minmax(0,1fr);grid-template-rows:auto auto;position:relative;min-height:54px;column-gap:6px;padding:6px 7px;background:#0a1923f2;border:1px solid var(--edge);text-align:left;overflow:hidden}
.formation>svg{grid-row:1/3;align-self:center;width:22px;height:22px;color:#95b5b9}
.formation .formation-title{font-size:11px;font-weight:850;letter-spacing:.08em;line-height:1.15;padding-right:19px}
.formation kbd{position:absolute;right:5px;top:5px;border:1px solid currentColor;padding:1px 3px;color:var(--muted);font:700 8px/1 var(--mono)}
.formation .form-status{color:var(--muted);font:700 8px/1.15 var(--mono);letter-spacing:.08em;align-self:center}
.formation:not(:disabled):hover{background:#274044;border-color:#a4cfce}
.formation:not(:disabled):active{background:#34595b}
.formation.active{border-color:#8ff2e0;background:#143332;box-shadow:inset 0 -2px #82e2cd}
.formation.active svg,.formation.active kbd,.formation.active .form-status{color:var(--cyan)}
.formation.recommended,.formation.burst-ready{border-color:#ffcc80;background:#30271e}
.formation.recommended{box-shadow:inset 0 -2px #ffd080}
.formation.recommended svg,.formation.recommended .form-status,.formation.recommended kbd,.formation.burst-ready svg,.formation.burst-ready .form-status{color:var(--gold)}
.formation:disabled:not(.active) svg{opacity:.47}
.formation-charge{position:absolute;bottom:0;left:0;right:0;height:2px;transform-origin:left center;background:var(--gold);opacity:.7}
.screen{position:absolute;inset:0;z-index:4}
.menu{overflow:auto;padding:clamp(62px,12vh,146px) var(--right) max(56px,var(--bottom)) clamp(24px,8vw,130px);background:linear-gradient(90deg,#07131e 0%,#07131ef7 22%,#07131eaa 49%,#07131e00 78%);touch-action:pan-y}
.menu-inner{width:min(680px,94vw)}
.menu-tag{display:flex;align-items:center;gap:8px;color:var(--cyan);margin-bottom:clamp(10px,2.5vh,22px)}
.menu-tag>span:first-child{display:grid;place-items:center;width:29px;height:29px;border:1px solid #8fe4da65;font-size:18px}
.menu-title h1{margin:0 0 8px;font-size:clamp(55px,10.7vw,168px);letter-spacing:-.097em;line-height:.78;font-weight:950;color:var(--paper);text-shadow:0 3px 34px #091c22}
.menu-title p{margin:0;color:var(--cyan);font:850 clamp(11px,1.75vw,22px)/1.2 var(--mono);letter-spacing:.21em}
.menu-brief{margin:clamp(13px,3vh,28px) 0;color:#bfd2d3;font-size:clamp(13px,1.55vw,18px);line-height:1.55;max-width:390px}
.protocol{margin:0 0 clamp(12px,2vh,19px);width:min(400px,100%);color:var(--muted)}
.segmented{display:flex;gap:4px;margin:6px 0}
.segmented button{background:#0b1d28;border:1px solid var(--edge);color:var(--muted);flex:1;min-height:33px;font:700 10px/1 var(--mono);letter-spacing:.055em}
.segmented button[aria-pressed="true"]{color:var(--cyan);border-color:#8ae6d8;background:#143331}
.segmented button:hover{border-color:#8ae6d8}
.protocol p{margin:0;min-height:28px;color:#a8c3c7;font:10px/1.35 var(--mono)}
.menu-main,.menu-links,.actions{display:flex;align-items:center;gap:7px 9px;flex-wrap:wrap}
.button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:41px;padding:0 14px;border:1px solid #80c3ca65;background:#10232d;color:var(--paper);font:850 11px/1.15 var(--mono);letter-spacing:.08em;white-space:nowrap}
.button:hover{background:#23454d;border-color:#9df1e6}
.button:active{background:#315763}
.button.primary{background:var(--gold);border-color:var(--gold);color:#1b1a16;box-shadow:4px 4px 0 #ffcd7844}
.button.primary:hover{background:#ffe4b0}
.button.primary:active{background:#f7bb61;box-shadow:1px 1px 0 #ffcd7844}
.button.primary::after{content:'→';margin-left:8px}
.text-button{padding:6px 3px;border:0;border-bottom:1px solid #729ba050;background:none;color:#bdd3d7;font:800 10px/1.35 var(--mono);letter-spacing:.095em;white-space:nowrap}
.text-button:hover{color:var(--cyan);border-color:var(--cyan)}
.menu-links{margin-top:11px}
.menu-status{margin:clamp(13px,3vh,27px) 0 0;color:var(--muted);font:700 9px/1.2 var(--mono);letter-spacing:.12em}
.menu-credit{position:fixed;bottom:var(--bottom);left:var(--left);right:var(--right);display:flex;justify-content:space-between;gap:8px;color:#a2c1c5;pointer-events:none;font-size:9px}
.modal{display:grid;place-items:center;overflow:auto;padding:calc(var(--top) + 45px) var(--right) var(--bottom) var(--left);background:#061018b8;backdrop-filter:blur(6px);touch-action:pan-y}
.sheet{width:min(630px,100%);max-height:100%;overflow:auto;border:1px solid #79c6c76e;border-top:3px solid var(--cyan);background:linear-gradient(137deg,#142631,#091721 70%);padding:clamp(16px,3vw,33px);box-shadow:0 15px 74px #02070baa}
.sheet.compact{width:min(535px,100%)}
.sheet.wide{width:min(790px,100%)}
.sheet h2{font-size:clamp(26px,5.7vw,63px);line-height:.91;letter-spacing:-.055em;font-weight:950;margin:9px 0 11px}
.sheet p{margin:0 0 16px;color:#bfd4d7;font-size:14px;line-height:1.45}
.sheet .control-help{margin:15px 0 0;color:var(--muted);font:11px/1.5 var(--mono)}
#options .control-help{margin:12px 0 14px}
.kicker{color:var(--cyan)}
.setting-list{display:grid;gap:0}
.setting{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--edge)}
.setting:first-child{border-top:1px solid var(--edge)}
.setting strong{display:block;font-size:13px;margin-bottom:2px}
.setting small{display:block;color:var(--muted);font-size:11px;line-height:1.35}
.toggle{min-width:53px;min-height:31px;border:1px solid var(--edge);background:#0a1923;color:var(--muted);font:800 10px/1 var(--mono);letter-spacing:.10em}
.toggle[aria-pressed="true"]{color:var(--cyan);background:#143332;border-color:#79c9ba}
.toggle:hover{border-color:var(--cyan)}
.upgrade-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.upgrade{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:149px;min-width:0;background:#122631;border:1px solid #86bdc161;padding:12px;text-align:left}
.upgrade:hover{border-color:var(--gold);background:#29352f}
.upgrade .micro{color:var(--cyan);font-size:9px}
.upgrade strong{font-size:clamp(15px,2.5vw,24px);line-height:1.05;letter-spacing:-.03em}
.upgrade small{font-size:12px;line-height:1.36;color:#c8dcdf}
.upgrade kbd{margin-top:auto;border:1px solid var(--edge);padding:1px 4px;color:var(--gold);font:800 10px/1 var(--mono)}
.result{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:12px 0 17px}
.result>div{padding:8px;background:#0b1c26;border:1px solid var(--edge)}
.result span{display:block;color:var(--muted);font:700 8px/1.15 var(--mono);letter-spacing:.09em}
.result strong{display:block;color:var(--cyan);font:750 clamp(13px,2.7vw,22px)/1 var(--mono);margin-top:4px}
.record-list{display:grid;margin-bottom:15px;gap:3px}
.record-row{display:grid;grid-template-columns:.73fr 1.15fr 1fr;gap:6px;padding:7px 5px;border-bottom:1px solid var(--edge);color:#cce1e4;font:10px/1.35 var(--mono)}
.record-row:first-child{font-weight:800;color:var(--cyan);letter-spacing:.07em}
@media (max-width:920px){.utility .icon-label{display:none}.utility button{padding:0 7px}.tactical{top:calc(var(--top) + 85px)}}
@media (max-width:580px){
  :root{--top:max(7px,env(safe-area-inset-top));--left:max(7px,env(safe-area-inset-left));--right:max(7px,env(safe-area-inset-right));--bottom:max(7px,env(safe-area-inset-bottom))}
  .mission{min-width:130px;padding:6px 6px 7px 7px}.mission .micro{font-size:8px;gap:5px}.mission strong{font-size:14px;margin:3px 0 5px}.wave{font-size:8px;gap:5px}.utility{gap:3px}.icon-button{min-height:33px;min-width:31px}
  .boss{top:calc(var(--top) + 60px);width:70vw;padding:5px 6px}.boss>div:first-child{font-size:8px;margin-bottom:4px}
  .tactical{top:calc(var(--top) + 62px);padding:5px 7px;gap:4px 6px;max-width:94vw;font-size:9px;flex-wrap:wrap;justify-content:center;text-align:center}.boss:not([hidden])+.tactical{top:calc(var(--top) + 94px)}.tactical strong{font-size:10px}
  .formation{display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;gap:3px;padding:4px 2px;min-height:55px}.formation>svg{width:15px;height:15px}.formation .formation-title{padding:0;font-size:9px;letter-spacing:.055em}.formation kbd{font-size:7px;right:2px;top:2px;padding:1px 2px}.formation .form-status{font-size:7px}
  .hint{bottom:calc(var(--bottom) + 101px);padding:5px 6px;font-size:10px}.hull{padding:4px 6px;min-width:78px}.count{padding:4px 6px;gap:4px}.readout span,.support{font-size:8px}.support{padding:0 5px}.readout strong{font-size:10px}
  .menu{padding-left:18px;background:linear-gradient(90deg,#07131ef9,#07131ec7 58%,#07131e4d)}.menu-title h1{font-size:clamp(44px,13vw,75px)}.menu-inner{width:min(94%,520px)}.menu-credit{font-size:7px}
  .upgrade-list{grid-template-columns:1fr;gap:5px}.upgrade{min-height:0;display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:7px 9px}.upgrade strong,.upgrade small{grid-column:1}.upgrade kbd{grid-column:2;grid-row:1/4;align-self:center;margin:0}
  .result{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-height:530px) and (min-width:581px){
  :root{--top:max(7px,env(safe-area-inset-top));--bottom:max(6px,env(safe-area-inset-bottom))}
  .mission{padding:5px 8px}.mission strong{margin:3px 0 4px;font-size:15px}.dock{width:min(635px,86vw)}.formation{min-height:41px;padding:4px 6px}.hint{bottom:calc(var(--bottom) + 83px)}.announcement{top:27%}.tactical{top:calc(var(--top) + 49px)}
  .menu{padding-top:49px}.menu-tag{margin-bottom:9px}.menu-title h1{font-size:clamp(45px,11vw,97px)}.menu-brief{margin:9px 0;font-size:13px;max-width:420px}.menu-status{margin-top:8px}.protocol{margin-bottom:6px}.protocol p{min-height:15px}.menu-links{margin-top:7px}
}
@media (prefers-reduced-motion:reduce){.icon-button,.button,.text-button{transition:none}}

#draftBack{margin-top:11px}

.checkpoint{color:var(--cyan);border-color:#8ff2e0;background:#143332}.saved-status{margin-top:5px;color:var(--cyan)}

.badges-title{color:var(--cyan);font:850 11px/1.2 var(--mono);letter-spacing:.12em;margin:8px 0 7px}
.badge-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;margin-bottom:15px}
.badge{display:grid;grid-template-columns:16px 1fr;align-items:start;gap:2px 6px;padding:6px 7px;border:1px solid var(--edge);background:#0c1b24}
.badge strong{color:#d3e2e2;font-size:11px;line-height:1.2}
.badge small{grid-column:2;color:#9ab6bd;font-size:9px;line-height:1.25}
.badge .mark{color:#63848b;font:11px/1.2 var(--mono)}
.badge.earned-badge{border-color:#d2aa66;background:#2a251b}
.badge.earned-badge .mark,.badge.earned-badge strong,.sheet .earned{color:var(--gold)}
.sheet .earned{font:800 10px/1.5 var(--mono);letter-spacing:.07em}

.chain{color:var(--gold);font:800 10px/1 var(--mono);font-style:normal;min-width:17px}
.quick-controls{margin:5px 0 0;color:var(--faint);font:750 9px/1.2 var(--mono);letter-spacing:.08em}
.sheet .debrief-note{padding:7px 9px;border-left:2px solid var(--gold);color:#e8d6b2;background:#342b226b;font-size:12px}
@media(min-width:1800px){
  .mission{min-width:228px}.mission .micro,.wave{font-size:11px}.tactical{font-size:13px;min-height:37px}.tactical strong{font-size:14px}
  .dock{width:min(870px,56vw)}.formation{min-height:63px}.formation .formation-title{font-size:13px}.formation .form-status{font-size:9px}
  .readout{min-height:36px}.readout span{font-size:10px}.readout strong{font-size:14px}
}
@media(pointer:coarse){.quick-controls{display:none}}
@media(max-width:355px){.support{display:none}.count{padding-inline:5px}.formation .formation-title{font-size:8px}}

.wave-track{height:2px;background:#24444b;margin-top:7px}.wave-track i{display:block;height:100%;width:100%;background:#82e3d0;transform-origin:left center}
.manual-tabs{max-width:435px;margin:0 0 10px}
.manual-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin:0 0 14px}
.manual-card{display:grid;grid-template-columns:32px minmax(0,1fr);gap:3px 7px;padding:9px;background:#0b1b24;border:1px solid var(--edge)}
.manual-card svg{grid-row:1/3;width:28px;height:28px;align-self:start;color:var(--cyan)}
.manual-card strong{color:#e4f1ed;font-size:12px;line-height:1.15}
.manual-card p{grid-column:2;color:#aebfc5;font-size:11px;margin:0;line-height:1.42}
.manual-card kbd{color:var(--gold);margin-left:5px;font:800 9px/1 var(--mono)}
@media(max-width:460px){.manual-list{grid-template-columns:1fr}.manual-card{padding:6px 7px}}

.binding-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-bottom:9px}
.binding{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 7px;border:1px solid var(--edge);background:#0b1a23}
.binding span{font-size:11px;font-weight:700;color:#c3d6da}
.binding button{min-height:30px;min-width:34px;padding:2px 4px;background:#143332;border:1px solid #81dbcd87;color:var(--cyan);font:800 9px/1 var(--mono)}
.binding button:hover,.binding button.listening{border-color:var(--gold);color:var(--gold)}
.binding-status{min-height:29px;color:var(--gold);font:11px/1.4 var(--mono);margin:0 0 7px}
.sheet p.key-help{font-size:12px;margin-bottom:8px}

.sheet .rush-record{color:#b9d5d6;font:10px/1.4 var(--mono);margin:0 0 13px}

/* Combat chrome stays at the edges; the field is the primary view. */

<body>
<main id="game">
  <canvas id="canvas" aria-hidden="true"></canvas>
  <div id="hurt" class="hurt" aria-hidden="true"></div>

  <div class="utility">
    <button type="button" id="sound" class="icon-button" data-t="soundOn"></button>
    <button type="button" id="fullscreen" class="icon-button" data-t="fullscreen"></button>
    <button type="button" id="pause" class="icon-button" data-t="pause" hidden></button>
  </div>

  <section id="flight" class="flight" aria-label="Flight instruments" hidden>
    <div class="mission">
      <div class="micro"><span id="operation"></span><span class="separator"></span><time id="clock">00:00</time></div>
      <strong id="sectorName"></strong>
      <div class="wave"><span id="wavePips"><i></i><i></i><i></i><i></i><i></i></span><span id="objective"></span></div>
      <div class="wave-track" id="waveTrack" aria-hidden="true"><i id="waveFill"></i></div>
    </div>
    <div class="boss hud-panel" id="boss" hidden>
      <div><span id="bossName"></span><span id="bossPhase"></span></div>
      <div class="meter"><i id="bossFill"></i></div>
    </div>
    <div id="tactical" class="tactical hud-panel" role="status" hidden>
      <span id="tacticalLabel" class="micro"></span>
      <strong id="tacticalOrder"></strong><span id="tacticalReason"></span>
    </div>
    <div class="announcement" id="announcement" hidden>
      <div id="announceLabel" class="micro"></div><strong id="announceTitle"></strong><span id="announceBody"></span>
    </div>
    <div id="hint" class="hint hud-panel" role="status" hidden></div>

    <div class="readout">
        <div class="hull"><div><span data-t="hull"></span><strong id="hullNumber"></strong></div><div class="meter"><i id="hullFill"></i></div></div>
        <div class="count"><span data-t="drones"></span><strong id="droneCount">001</strong><small id="fabrication"></small></div>
        <div class="count score"><span data-t="score"></span><strong id="score">000000</strong><i class="chain" id="chain" hidden></i></div>
        <div id="support" class="support" hidden></div>
    </div>
    <section class="dock">
      <div id="formations" class="formations" aria-label="Formation commands"></div>
    </section>
  </section>

  <section id="menu" class="screen menu" aria-labelledby="gameTitle">
    <div class="menu-inner">
      <div class="menu-tag micro"><span aria-hidden="true">◈</span><span data-t="menuTag"></span></div>
      <div class="menu-title">
        <h1 id="gameTitle" data-t="title"></h1>
        <p data-t="tagline"></p>
      </div>
      <p class="menu-brief" data-t="brief"></p>
      <div class="protocol" aria-labelledby="protocolLabel"><span id="protocolLabel" class="micro" data-t="protocol"></span><div id="protocols" class="segmented"></div><p id="protocolNote"></p></div>
      <div class="menu-main">
        <button type="button" id="campaign" class="button primary" data-t="campaignAction"></button>
        <button type="button" id="endless" class="button" data-t="endlessAction"></button>
        <button type="button" id="rush" class="button" data-t="rushAction" hidden></button>
        <button type="button" id="continueRun" class="button checkpoint" hidden></button>
      </div>
      <div class="menu-links">
        <button type="button" id="training" class="text-button" data-t="trainingAction"></button>
        <button type="button" id="manual" class="text-button" data-t="manual"></button>
        <button type="button" id="settings" class="text-button" data-t="settings"></button>
        <button type="button" id="records" class="text-button" data-t="records"></button>
        <button type="button" id="changelog" class="text-button" data-t="changelog"></button>
      </div>
      <p class="menu-status" id="menuStatus"></p>
      <p class="quick-controls" id="quickControls"></p>
      <p class="menu-status saved-status" id="savedStatus" hidden></p>
    </div>
    <aside class="campaign-teaser"><span class="micro" data-t="campaignRoute"></span><h2 data-t="routeTitle"></h2><p data-t="routeTeaser"></p><div id="menuRoute" class="mini-route"></div><button id="viewMap" class="text-button" type="button" data-t="viewMap"></button></aside>
    <div class="menu-credit micro"><span data-t="menuCredit"></span><span data-t="menuBuild"></span></div>
  </section>

  <section id="mapMenu" class="screen map-screen" aria-labelledby="mapTitle" hidden>
    <header class="map-header"><div><span class="micro" data-t="campaignRoute"></span><h2 id="mapTitle" data-t="routeTitle"></h2></div><button id="mapBack" class="button" type="button" data-t="back"></button></header>
    <div class="map-layout"><div class="route-chart"><svg viewBox="0 0 600 460" aria-hidden="true"><path d="M80 350 L185 150 L300 285 L405 95 L525 215"/></svg><div id="mapNodes"></div><div class="map-legend" data-t="routeLegend"></div></div>
      <article class="chapter-intel"><span id="chapterIndex" class="micro"></span><h3 id="chapterTitle"></h3><p id="chapterBrief"></p><div id="chapterRules" class="chapter-rules"></div><ol id="chapterPhases" class="chapter-phases"></ol><p id="mapStatus" role="status"></p><div class="actions"><button id="mapDeploy" class="button primary" type="button"></button><button id="mapPractice" class="button" type="button" data-t="practiceChapter"></button></div></article></div>
  </section>
  <section id="changelogMenu" class="screen modal" aria-labelledby="changelogTitle" hidden><div class="sheet wide"><span class="micro kicker" data-t="releaseChannel"></span><h2 id="changelogTitle" data-t="changelog"></h2><div id="releaseList" class="release-list"></div><button id="changelogBack" class="button primary" type="button" data-t="back"></button></div></section>

  <section id="pauseMenu" class="screen modal" aria-labelledby="pauseTitle" hidden>
    <div class="sheet compact">
      <span class="micro kicker" data-t="pauseTag"></span>
      <h2 id="pauseTitle" data-t="pauseTitle"></h2>
      <p id="pauseInfo"></p>
      <div class="actions">
        <button type="button" id="resume" class="button primary" data-t="resume"></button>
        <button type="button" id="inspectField" class="button" data-t="inspectField"></button>
        <button type="button" id="pauseSettings" class="button" data-t="settings"></button>
        <button type="button" id="pauseManual" class="text-button" data-t="manual"></button>
        <button type="button" id="retire" class="text-button" data-t="retire"></button>
      </div>
      <p class="control-help" id="pauseControls"></p>
    </div>
  </section>

  <div id="inspectBar" class="inspect-bar" hidden><span data-t="inspectHint"></span><button type="button" id="inspectResume" class="text-button" data-t="resume"></button><button type="button" id="inspectBack" class="text-button" data-t="back"></button></div>

  <section id="options" class="screen modal" aria-labelledby="optionsTitle" hidden>
    <div class="sheet compact">
      <span class="micro kicker" data-t="optionsTag"></span>
      <h2 id="optionsTitle" data-t="settings"></h2>
      <div id="settingList" class="setting-list"></div>
      <p class="control-help" id="optionsControls"></p>
      <div class="actions">
        <button type="button" id="optionsBack" class="button primary" data-t="back"></button>
        <button type="button" id="editKeys" class="button" data-t="keyBindings"></button>
      </div>
    </div>
  </section>

  <section id="bindingsMenu" class="screen modal" aria-labelledby="bindingsTitle" hidden>
    <div class="sheet compact">
      <span class="micro kicker" data-t="inputTag"></span>
      <h2 id="bindingsTitle" data-t="keyBindings"></h2>
      <p class="key-help" data-t="keyHelp"></p>
      <div id="bindingList" class="binding-list"></div>
      <div id="bindingStatus" class="binding-status" role="status"></div>
      <div class="actions">
        <button type="button" id="bindingsBack" class="button primary" data-t="back"></button>
        <button type="button" id="restoreKeys" class="button" data-t="restoreKeys"></button>
      </div>
    </div>
  </section>

  <section id="manualMenu" class="screen modal" aria-labelledby="manualTitle" hidden>
    <div class="sheet wide">
      <span class="micro kicker" data-t="manualTag"></span>
      <h2 id="manualTitle" data-t="manual"></h2>
      <div class="segmented manual-tabs" id="manualTabs"></div>
      <div class="manual-list" id="manualList"></div>
      <button type="button" id="manualBack" class="button primary" data-t="back"></button>
    </div>
  </section>

  <section id="recordsMenu" class="screen modal" aria-labelledby="recordsTitle" hidden>
    <div class="sheet">
      <span class="micro kicker" data-t="recordsTag"></span>
      <h2 id="recordsTitle" data-t="records"></h2>
      <div id="recordList" class="record-list"></div>
      <p class="rush-record" id="rushRecord" hidden></p>
      <h3 class="badges-title" data-t="badges"></h3>
      <div id="badgeList" class="badge-list"></div>
      <button type="button" id="recordsBack" class="button primary" data-t="back"></button>
    </div>
  </section>

  <section id="draft" class="screen modal" aria-labelledby="draftTitle" hidden>
    <div class="sheet wide">
      <span id="draftKicker" class="micro kicker"></span>
      <h2 id="draftTitle" tabindex="-1" data-t="draftTitle"></h2>
      <p id="draftNext"></p>
      <p class="build-summary micro" id="buildSummary"></p>
      <div class="upgrade-list" id="upgradeList"></div>
      <button type="button" id="rerollDraft" class="button"></button>
      <button type="button" id="draftBack" class="text-button" data-t="retire"></button>
    </div>
  </section>

  <section id="debrief" class="screen modal" aria-labelledby="debriefTitle" hidden>
    <div class="sheet">
      <span id="debriefKicker" class="micro kicker"></span>
      <h2 id="debriefTitle"></h2>
      <p id="debriefText"></p><p id="deathCause" class="death-cause" hidden></p>
      <p class="debrief-note" id="debriefNote" hidden></p>
      <div class="result" id="result"></div>
      <p class="build-summary" id="resultBuild" hidden></p>
      <p class="earned" id="earned" hidden></p>
      <div class="actions">
        <button type="button" id="retry" class="button primary"></button>
        <button type="button" id="return" class="button" data-t="return"></button>
      </div>
    </div>
  </section>
</main>

  function drop(g,x,y,count){

  function spawnPoint(g){
    const p=g.player;
    let x,y;
    // Spawn around the active fight so very wide or tall screens don't create dead zones.
    for(let attempt=0;attempt<8;attempt++){
      const a=g.rand()*TAU,r=240+g.rand()*185;
      x=clamp(p.x+Math.cos(a)*r,24,g.w-24);
      y=clamp(p.y+Math.sin(a)*r,24,g.h-24);
      if(d2(x,y,p.x,p.y)>220**2)break;
    }
    return {x,y};
  }
  function spawn(g,type,x,y){
    if(x===undefined)({x,y}=spawnPoint(g));
    const spec=enemy[type];
    const scale=1+Math.min(8,g.round)*(g.kind==='endless'?.13:.10)+Math.max(0,g.round-8)*.075;
    const endurance=spec.boss&&g.kind==='campaign'?1.45+g.round*.35:1;
    const hp=Math.ceil(spec.hp*scale*g.rules.health*endurance);
    const e={type,x,y,hp,max:hp,r:spec.r,speed:spec.speed*g.rules.travel*(1+Math.min(g.round,8)*.018),
      boss:!!spec.boss,armored:!!spec.armored,angle:0,wind:0,ready:g.t+1.1+g.rand()*.7,flash:0,born:g.t,attackIndex:0};
    g.enemies.push(e);
    if(['pulsar','weaver','bulwark'].includes(type)&&!g.seenTypes[type]){g.seenTypes[type]=true;tip(g,type,5);emit(g,'enemy_discovered',{type});}
    return e;
  }
  function spawnGroup(g,group){
    const pos=spawnPoint(g),p=g.player,a=angle(p.x,p.y,pos.x,pos.y)+Math.PI/2;
    const limit=34+Math.min(10,g.round*2);
    group.forEach((type,i)=>{
      if(g.enemies.length>=limit)return;
      if(['pulsar','weaver','bulwark'].includes(type)&&g.enemies.some(e=>e.type===type&&e.hp>0))return;
      if(['pulsar','weaver'].includes(type)&&g.enemies.filter(e=>['pulsar','weaver'].includes(e.type)&&e.hp>0).length>=2)return;
      const off=(i-(group.length-1)/2)*28;
      spawn(g,type,clamp(pos.x+Math.cos(a)*off,18,g.w-18),clamp(pos.y+Math.sin(a)*off,18,g.h-18));
    });
  }
  function waveDuration(g){
    return (sector(g).waves[g.wave]?.length||0)*(g.kind==='endless'?.42:1);
  }
  function scheduleWave(g,e,gap,fire){
    if(g.hazards.filter(h=>h.end>g.t).length>=3)return;
    g.hazards.push({type:'wave',x:e.x,y:e.y,start:g.t,fire,end:fire+2.55,speed:174,width:15,gap,gapHalf:.60,owner:e,source:'wave'});
    emit(g,'pattern_spawned',{pattern:'wave',enemy:e.type});
  }
  function scheduleSweep(g,e,fire){
    if(g.hazards.filter(h=>h.end>g.t).length>=3)return;
    const horizontal=e.attackIndex%2===0,p=g.player,axis=horizontal?'x':'y',cross=horizontal?g.h:g.w;
    const origin=horizontal?p.y:p.x;
    const direction=origin<cross*.35?1:origin>cross*.65?-1:e.attackIndex%2?1:-1;
    // The warning asks for a deliberate move into the corridor, including near an arena edge.
    const gap=clamp(origin+direction*120,85,cross-85);
    g.hazards.push({type:'sweep',axis,x:horizontal?-32:0,y:horizontal?0:-32,endX:horizontal?g.w+32:0,endY:horizontal?0:g.h+32,
      gap,gapHalf:75,width:28,start:g.t,fire,end:fire+3.1,source:'sweep',owner:e});
    emit(g,'pattern_spawned',{pattern:'sweep',enemy:e.type});
  }
  function patternRadius(h,time){return 24+Math.max(0,time-h.fire)*h.speed;}
  function patternDanger(g,h,p,pad=8,time=g.t){
    if(h.end<=time)return false;
    if(h.type==='wave'){
      const r=Math.hypot(p.x-h.x,p.y-h.y),a=angle(h.x,h.y,p.x,p.y);
      return angularDistance(a,h.gap)>h.gapHalf-Math.min(.2,pad/Math.max(30,r))&&Math.abs(r-patternRadius(h,time))<h.width/2+pad;
    }
    if(h.type==='sweep'){
      const pos=hazardPosition(h,time),distance=h.axis==='x'?Math.abs(p.x-pos.x):Math.abs(p.y-pos.y),cross=h.axis==='x'?p.y:p.x;
      return distance<h.width/2+pad&&Math.abs(cross-h.gap)>h.gapHalf-pad;
    }
    return false;
  }

  function fieldAttack(g,id){
    const p=g.player;
    if(id==='veil'){
      const axis=g.rand()>.5?'x':'y',edge=axis==='x'?g.w:g.h;
      g.hazards.push({type:'sweep',axis,x:axis==='x'?-30:0,y:axis==='y'?-30:0,gap:axis==='x'?p.y:p.x,gapHalf:82,width:24,endX:axis==='x'?g.w+30:0,endY:axis==='y'?g.h+30:0,start:g.t,fire:g.t+1.7,end:g.t+5.5,source:'sweep'});
    }else if(id==='forge'){
      for(const side of [-1,1])g.hazards.push({type:'surge',x:clamp(p.x+side*112,40,g.w-40),y:clamp(p.y+side*35,40,g.h-40),radius:66,start:g.t,fire:g.t+1.6,end:g.t+2,source:'surge'});
    }else if(id==='belt'){
      const horizontal=g.rand()>.44,reverse=g.rand()>.50,spread=(g.rand()-.5)*144;
      const cross=clamp((horizontal?p.y:p.x)+spread,36,(horizontal?g.h:g.w)-36);
      const edge=horizontal?g.w:g.h,start=reverse?edge+44:-44,end=reverse?-44:edge+44;
      const x=horizontal?start:cross,y=horizontal?cross:start,endX=horizontal?end:cross,endY=horizontal?cross:end;
      const travel=clamp(edge/840,.84,1.38);
      g.hazards.push({type:'debris',x,y,endX,endY,width:51,start:g.t,fire:g.t+1.22,end:g.t+1.22+travel,source:'debris'});
    }else if(id==='core'){
      const a=g.rand()*TAU;
      for(let i=0;i<(g.wave===0?1:2);i++){
        const r=i?157:38,b=a+i*2.34;
        g.hazards.push({type:'surge',x:clamp(p.x+Math.cos(b)*r,32,g.w-32),y:clamp(p.y+Math.sin(b)*r,32,g.h-32),
          radius:i?51:67,start:g.t,fire:g.t+1.42+i*.12,end:g.t+1.81+i*.12,source:'surge'});
      }
    }
    cue(g,'wind');emit(g,'field_warning',{sector:id});
  }
  function encounter(g){
    const s=sector(g),elapsed=g.t-g.waveStart;
    if(g.wave<s.waves.length&&elapsed>=waveDuration(g)){
      if(g.wave<s.waves.length-1){
        g.phase='draft';g.draftReason='wave';g.draft=draft(g);cue(g,'clear');return;
      }
      g.wave++;g.waveStart=g.t;g.nextSpawn=g.t+2.6;g.bossArrival=g.t+2.6;g.enemies.length=g.hostile.length=g.shots.length=g.hazards.length=0;g.player.inv=2.8;signal(g,'boss',2.6);emit(g,'boss_approach',{chapter:g.round+1});
    }
    if(g.wave===s.waves.length&&!g.bossSpawned){
      if(g.kind==='rush'&&g.t-g.sectorStart<1.95||g.t<g.bossArrival)return;
      g.bossSpawned=true;
      // A readable phase break: the boss takes over after the wave, rather than stacking on its leftovers.
      for(const e of g.enemies)if(e.hp>0){spark(g,e.x,e.y,'ally',7);}
      g.enemies.length=0;g.hostile.length=0;g.hazards.length=0;g.fields.length=0;
      g.player.inv=Math.max(g.player.inv,1.15);
      pulse(g,g.player.x,g.player.y,150,'ally',.55);
      const radius=enemy[s.boss].r;
      const x=clamp(g.player.x,radius+20,g.w-radius-20);
      const side=g.player.y>g.h*.5?-1:1;
      const y=clamp(g.player.y+side*150,radius+20,g.h-radius-20);
      spawn(g,s.boss,x,y);signal(g,'boss',3.1);g.nextSpawn=g.t+4.4;
      emit(g,'boss_entered',{type:s.boss});
    }
    if(!g.bossSpawned&&s.id!=='array'&&g.t>=g.nextField&&g.hazards.length<2&&g.t-g.waveStart<waveDuration(g)-3.1){
      fieldAttack(g,s.id);g.nextField=g.t+((s.id==='belt'?11.4:10.8)+g.rand()*2.7)*variant(g).field;
    }
    if(g.t<g.nextSpawn)return;
    if(g.bossSpawned){
      if(!g.bossDefeated){spawnEscorts(g,s.escort[g.groupIndex++%s.escort.length],s.id==='core'?4:35);g.nextSpawn=g.t+Math.max(3.1,(s.id==='core'?8.5:6.6-g.round*.3)*g.rules.pace);}
    }else{
      const wave=s.waves[g.wave];
      if(g.t-g.waveStart<waveDuration(g)-2.2){
        const v=variant(g),index=g.groupIndex++;
        spawnGroup(g,wave.groups[(index+v.offset)%wave.groups.length]);
        if(v.reinforcement&&g.wave>0&&index%6===5)spawnGroup(g,[v.reinforcement]);
      }
      const interval=wave.interval*g.rules.pace*(g.kind==='endless'?.92:1)/Math.min(1.28,1+Math.max(0,g.round-2)*.045);
      // Four spawn groups form a phrase, followed by a brief collection and repositioning window.
      g.nextSpawn=beatAt(g,g.t+interval+(g.groupIndex%4===0?1.35:0),2);
    }
  }

  const multiplier=g=>g.t>=g.chainUntil?1:g.chain>=14?3:g.chain>=6?2:1;
  function kill(g,e,source){
    const previous=multiplier(g);
    g.chain=g.t<g.chainUntil?g.chain+1:1;
    g.chainUntil=g.t+2.6;g.stats.bestChain=Math.max(g.stats.bestChain,g.chain);
    if(multiplier(g)>previous)cue(g,'chain');
    for(const h of g.hazards)if(h.owner===e&&h.fire>g.t)h.end=g.t;
    g.kills++;
    const points=e.boss?2300:e.type==='ram'?180:e.type==='prism'?165:e.type==='splitter'?130:85;
    g.score+=points*multiplier(g);
    if(source==='blade'){
      if(level(g,'siphon')&&(g.stats.bladeKills+1)%3===0){g.player.hp=Math.min(g.player.max,g.player.hp+2);pulse(g,e.x,e.y,32,'ally',.3);}
      g.stats.bladeKills++;combatMark(g,'cut',e.x,e.y,g.player.angle,e.r+19);}
    if(source==='spear'&&level(g,'forkLance')&&g.shots.length<86){
      for(const side of [-1,1]){const a=g.player.angle+side*.55;g.shots.push({x:e.x,y:e.y,vx:Math.cos(a)*500,vy:Math.sin(a)*500,life:.5,hit:30,pierce:1,kind:'shard',seen:[e]});}
    }
    if(source==='burst'&&level(g,'recycler')){g.parts++;fabricate(g);}
    if(g.kind!=='training')drop(g,e.x,e.y,e.boss?0:e.type==='ram'?5:e.type==='skimmer'?2:3);
    spark(g,e.x,e.y,'enemy',e.boss?160:e.r>20?31:18);cue(g,e.boss?'bossDown':'kill');
    if(e.boss){
      const finale=(g.kind==='campaign'||g.kind==='rush')&&g.round===sectors.length-1;
      g.bossDefeated=true;g.clearAt=g.t+(finale?1.85:1.4);
      g.banner={id:'clear',until:g.clearAt};g.tip=null;g.hostile.length=0;g.hazards.length=0;
      pulse(g,e.x,e.y,340,'enemy',1.25);pulse(g,e.x,e.y,210,'burst',.82);
      for(const enemy of g.enemies)if(enemy!==e&&enemy.hp>0)enemy.departAt=g.t+.17+g.visual()*.62;
    }
    if(e.type==='splitter'&&source!=='blade'&&source!=='burst'&&g.enemies.length<42){
      const a=e.angle+Math.PI/2;
      for(const side of [-1,1])spawn(g,'skimmer',clamp(e.x+Math.cos(a)*26*side,17,g.w-17),clamp(e.y+Math.sin(a)*26*side,17,g.h-17));
    }
  }
  function combatMark(g,type,x,y,a=0,rad=20){
    if(g.fx.length<1500)g.fx.push({type,x,y,a,rad,t:g.t,life:type==='hurt'?.48:.29,
      color:type==='guard'?'ally':type==='armor'?'burst':type==='hurt'?'enemy':'salvage'});
  }
  function damage(g,e,amount,source,impactAngle=null){
    if(e.hp<=0)return;
    if(source==='spear'&&!e.boss){
      if(e.wind>g.t){
        e.wind=0;e.attack=null;e.ready=g.t+2.1;e.staggerUntil=g.t+.65;g.stats.interrupts++;
        for(const h of g.hazards)if(h.owner===e&&h.fire>g.t)h.end=g.t;
        combatMark(g,'interrupt',e.x,e.y,0,e.r+15);cue(g,'interrupt');
      }
      if(e.type==='prism'||e.type==='bulwark'){
        if(!(e.shieldOpen>g.t)){g.stats.shieldBreaks++;combatMark(g,'interrupt',e.x,e.y,0,e.r+15);pulse(g,e.x,e.y,e.type==='bulwark'?104:35,'ally',.35);cue(g,'interrupt');}
        e.shieldOpen=g.t+1.6;
      }
    }
    if(source!=='spear'&&!e.boss){
      const ward=g.enemies.find(other=>other!==e&&other.type==='bulwark'&&other.hp>0&&!(other.shieldOpen>g.t)&&d2(e.x,e.y,other.x,other.y)<104**2&&d2(g.player.x,g.player.y,other.x,other.y)>104**2);
      if(ward){amount*=.32;combatMark(g,'armor',e.x,e.y,0,14);}
      if(e.type==='prism'&&!(e.shieldOpen>g.t)&&Math.cos((impactAngle??angle(e.x,e.y,g.player.x,g.player.y))-e.angle)>.25)amount*=.30;
    }
    const dealt=Math.min(e.hp,amount);

    const stat=(source==='blade'||source==='bladeShot')?'bladeDamage':['spear','shard','arc'].includes(source)?'spearDamage':source==='burst'?'burstDamage':'ringDamage';
    g.stats[stat]=(g.stats[stat]||0)+dealt;
    if(source==='spear'&&e.armored){
      g.stats.pierceHits++;cue(g,'pierce');
      if(g.t>=(e.nextPierceFx||0)){combatMark(g,'pierce',e.x,e.y,g.player.angle,e.r+12);e.nextPierceFx=g.t+.09;}
    }else if(e.armored&&source!=='burst'&&source!=='blade'){
      if(g.t>=(e.nextArmorFx||0)){combatMark(g,'armor',e.x,e.y,e.angle,e.r+4);e.nextArmorFx=g.t+.18;cue(g,'armor');}
    }
    if(source==='blade'){

        e.x=clamp(e.x+Math.cos(a)*8,15,g.w-15);e.y=clamp(e.y+Math.sin(a)*8,15,g.h-15);
      }
    }

  }
  function hit(g,amount,source){

  function burst(g){
    const cost=burstCost(g);

    const p=g.player;g.charge=0;g.drones-=cost;g.stats.bursts++;
    const target=g.aim;
    const direction=target?angle(p.x,p.y,target.x,target.y):p.angle;
    const distance=clamp(target?Math.hypot(target.x-p.x,target.y-p.y):260,65,400),n=level(g,'cluster')?3:1;
    for(let i=0;i<n;i++){
      const a=direction+(i-(n-1)/2)*.23;
      alliedBolt(g,p.x,p.y,a,480,n===3?105:230,'burst',0,distance/480);
    }
    emit(g,'burst_used',{cost});cue(g,'burst');pulse(g,p.x,p.y,75,'burst');return true;
  }
  function clearBullets(g,x,y,radius){
    for(const b of g.hostile)if(b.life>0&&d2(x,y,b.x,b.y)<radius*radius){b.life=0;spark(g,b.x,b.y,'burst',3);}
  }
  function blast(g,x,y,payload=230){
    const boost=level(g,'capacitor'),radius=level(g,'cluster')?72:94;
    clearBullets(g,x,y,radius+boost*8);
    pulse(g,x,y,radius+boost*9,'burst',.43);spark(g,x,y,'burst',38);
    if(level(g,'afterburn')&&g.echoes.length<64)g.echoes.push({x,y,at:g.t+.35});
    if(level(g,'cryo'))addField(g,'cryo',x,y,110,2.4);
    for(const e of g.enemies.slice())if(d2(x,y,e.x,e.y)<(radius+boost*8+e.r*.5)**2)damage(g,e,(payload+boost*25)*(level(g,'cryo')?.65:1),'burst');
  }

  const isSpear=g=>g.mode==='spear';
  function fire(g){
    const p=g.player,w=g.weapon;
    if(!g.aim)return false;
    // Every projectile follows the actual pointer/stick bearing. There is no target search.
    if(w.conductor){
      w.conductor=false;
      for(let i=-2;i<=2;i++)alliedBolt(g,p.x,p.y,p.angle+i*.13,570,27,'ally',1,.65);
      pulse(g,p.x,p.y,72,'salvage',.25);
    }
    if(g.mode==='spear'){
      const power=(52+Math.min(110,g.drones*1.7)+level(g,'lance')*16)*(level(g,'siege')?1.9:level(g,'arc')?.78:1)*(.35+.65*w.lock);
      alliedBolt(g,p.x+Math.cos(p.angle)*18,p.y+Math.sin(p.angle)*18,p.angle,1080,power,'spear',level(g,'siege')?11:4+level(g,'lance'),.85);
      if(level(g,'arc'))for(const side of [-1,1])alliedBolt(g,p.x,p.y,p.angle+side*.15,900,power*.55,'shard',2,.7);
      for(let i=0;i<level(g,'scatter');i++)alliedBolt(g,p.x,p.y,p.angle+(i?-.18:.18),620,16,'ally',0,.7);
      cue(g,'shotSpear');return true;
    }
    if(g.mode==='blades'){
      const n=1+level(g,'scatter');
      for(let i=0;i<n;i++)alliedBolt(g,p.x,p.y,p.angle+(i-(n-1)/2)*.2,410,27,'bladeShot',0,.40);
      cue(g,'cut');return true;
    }
    const charged=w.guard>=3,mirror=level(g,'mirror')&&w.guard>0;
    const n=Math.min(4,1+Math.floor(g.drones/24))+level(g,'scatter')+(charged?2:0);
    for(let i=0;i<n;i++){
      const offset=i===0?0:Math.ceil(i/2)*(i%2?1:-1)*.12;
      const bolt=alliedBolt(g,p.x+Math.cos(p.angle)*18,p.y+Math.sin(p.angle)*18,p.angle+offset,charged?670:620,(i===0?28:16)+(charged?22:0)+(mirror?12:0),mirror?'reflect':charged?'counter':'ally',charged?1:0);
      if(bolt)bolt.primary=i===0;
    }
    if(charged){w.guard=0;w.guardFlash=g.t+.32;g.stats.counterSalvos++;cue(g,'counter');}
    else if(mirror)w.guard--;

        if(f.type==='cryo'){c.setLineDash([]);for(let i=0;i<6;i++){const a=i*Math.PI/3;line(c,f.x+Math.cos(a)*5,f.y+Math.sin(a)*5,f.x+Math.cos(a)*14,f.y+Math.sin(a)*14);}}

      if(!state.frozen||state.inspect){annotations(g,state);edgeContacts(g,view,state);}

  }

  }

})();

<script>const FlightAudio=(()=>{
  const effects={
    arc:[920,340,.16,.055,'triangle',.14],counter:[310,1140,.18,.075,'triangle',.12],reflect:[1240,740,.09,.05,'sine',.08],interrupt:[1400,430,.19,.07,'triangle',.12],pattern:[100,43,.16,.085,'sine',.12],shotRing:[270,145,.065,.034,'triangle',.070],shotSpear:[560,125,.105,.047,'sawtooth',.095],shotBlades:[155,230,.075,.028,'triangle',.12],pickup:[580,950,.12,.072,'sine',.047],
    switch:[280,740,.16,.074,'sine',.05],unlock:[392,1120,.31,.10,'triangle',.25],
    kill:[230,52,.16,.061,'triangle',.063],hurt:[110,33,.23,.092,'sawtooth',.15],
    burst:[108,40,.46,.16,'sawtooth',.28],block:[1020,420,.089,.058,'sine',.062],
    pierce:[810,1480,.10,.055,'sine',.09],armor:[185,110,.07,.038,'square',.16],cut:[710,160,.11,.057,'triangle',.10],chain:[420,690,.13,.06,'sine',.24],wave:[90,260,.40,.080,'triangle',.25],
    wind:[205,420,.22,.040,'sine',.38],warning:[230,490,.28,.081,'square',.4],
    beam:[114,55,.35,.115,'sawtooth',.3],bossDown:[118,27,.66,.13,'sawtooth',.3],
    clear:[330,870,.53,.09,'triangle',.2],won:[330,1046,.67,.10,'triangle',.5],
    trained:[440,880,.55,.10,'triangle',.4],lost:[150,37,.57,.10,'triangle',.3]

  const patterns=[
    [36,0,43,0,38,45,0,0,34,0,41,0,31,38,0,0],
    [33,0,45,40,36,0,43,0,31,0,43,38,29,41,0,0],
    [40,0,47,0,42,0,49,0,38,0,45,0,35,0,42,0],
    [29,41,0,29,36,0,41,0,28,40,0,28,35,0,40,0],
    [31,43,0,38,30,42,38,0,29,41,0,36,27,39,36,0]

  const hz=n=>440*2**((n-69)/12);
  function create(){
    let context,sfx,score,playing=false,music=false,nextBeat=0,beat=-1,lastZone=-1,wasActive=false;

        if(!Audio)return;

      if(id==='block')voice(sfx,t+.014,1460,780,.055,.025,'sine');

<script>const FlightBindings=(()=>{
  const defaults=Object.freeze({up:'w',down:'s',left:'a',right:'d',ring:'1',spear:'2',blades:'3',burst:' '});
  const arrows=Object.freeze({arrowup:'up',arrowdown:'down',arrowleft:'left',arrowright:'right'});
  const valid=key=>typeof key==='string'&&/^[a-z0-9 ]$/.test(key)&&!['q','e','f','p'].includes(key);
  const label=key=>key===' '?'SPACE':key.toUpperCase();
  function create(saved){
    let keys={...defaults};
    if(saved&&typeof saved==='object'){
      const proposed=Object.keys(defaults).map(id=>saved[id]);
      if(proposed.every(valid)&&new Set(proposed).size===proposed.length)
        keys=Object.fromEntries(Object.keys(defaults).map((id,i)=>[id,proposed[i]]));
    }
    const action=key=>arrows[key]||Object.keys(keys).find(id=>keys[id]===key);
    const display=id=>label(keys[id]);
    const snapshot=()=>({...keys});
    const reset=()=>{keys={...defaults};};
    function set(id,key){
      if(!Object.hasOwn(defaults,id)||!valid(key))return false;
      const other=action(key);
      if(other&&other!==id)keys[other]=keys[id];
      keys[id]=key;
      return true;
    }
    return {action,display,snapshot,reset,set};
  }
  return {create};
})();
</script>

  });
  canvas.addEventListener('pointerleave',event=>{if(event.pointerType==='mouse'&&!firing){aim=null;aimPoint=null;}});
  for(const evt of ['pointerup','pointercancel','lostpointercapture']){
    canvas.addEventListener(evt,event=>{
      const triggerPointer=event.pointerType==='mouse'||aimTouch===event.pointerId;
      if(triggerPointer){
        if(evt==='pointerup'&&firing&&page==='playing'&&g.mode==='spear'){aimAt(event);releasePending={...aim};}
        else if(evt!=='pointerup'&&firing){g.weapon.held=false;releasePending=null;}
        firing=false;
      }
      if(moveTouch?.id===event.pointerId)moveTouch=null;
      if(aimTouch===event.pointerId){aimTouch=null;if(evt==='pointerup')clearAimAfterRelease=true;else{aim=null;aimPoint=null;clearAimAfterRelease=false;}}
    });
  }

  function resize(){
    const r=canvas.getBoundingClientRect();
    if(r.width<1||r.height<1)return;
    // A changed play area invalidates held movement and pointer bearings.
    // Freeze before rescaling instead of leaving the core exposed to old input.
    if(viewport&&(Math.abs(r.width-viewport.w)>1||Math.abs(r.height-viewport.h)>1))pause();
    viewport={w:r.width,h:r.height};
    const ratio=Math.min(2,devicePixelRatio||1,Math.sqrt(5900000/(r.width*r.height)));
    const w=Math.max(1,Math.round(r.width*ratio)),h=Math.max(1,Math.round(r.height*ratio));
    if(w!==canvas.width){canvas.width=w;drawDirty=true;}
    if(h!==canvas.height){canvas.height=h;drawDirty=true;}
    const next=worldSize(r.width,r.height);
    if(Math.abs(next.w-bounds.w)>.03||Math.abs(next.h-bounds.h)>.03){
      bounds=next;drawDirty=true;Swarm.resize(g,bounds);aim=null;aimPoint=null;moveTouch=null;aimTouch=null;
    }
  }

  function tacticalHud(){
    const panel=$('tactical');
    panel.hidden=!guide;
    if(!guide)return;
    const mode=guide.mode;
    const state=!mode?'evade':mode===g.mode?'hold':'switch';
    const className='tactical hud-panel '+state;
    if(panel.className!==className)panel.className=className;
    write('tacticalLabel',t('tactical'+cap(state)));
    $('tacticalOrder').hidden=!mode;
    if(mode)write('tacticalOrder',keyLabel(mode,true)+' / '+t(mode+'Name'));
    write('tacticalReason',t('reason'+cap(guide.reason),{name:guide.target?.boss?t(Swarm.sector(g).bossTitle||guide.target.type):''}));
  }
  function announcementHud(){
    const banner=$('announcement'),hint=$('hint');
    if(g.kind==='training'){
      const drill=g.training,index=drill.index;
      banner.hidden=false;banner.style.opacity=1;hint.hidden=true;
      write('announceLabel',drill.success?t('drillSuccess'):t('trainingCount',{n:index+1}));
      write('announceTitle',t('drill'+index+'Title'));write('announceBody',t('drill'+index+'Text',{key:keyLabel(forms[index])}));
      return;
    }
    const data=g.banner,s=Swarm.sector(g);
    banner.hidden=!data||g.t>=data.until;
    if(!banner.hidden){
      banner.style.opacity=settings.reduced?1:Math.min(1,(data.until-g.t)*2.2);
      const [label,title,body]=data.id==='clear'?['clearBanner',s.bossTitle||s.boss,'clearBrief']:
        data.id==='sector'?['sectorBanner',s.id,s.id+'Brief']:
        data.id==='wave'?['waveBanner','wave',g.wave===1?'wave2Brief':'wave3Brief']:['bossBanner',s.bossTitle||s.boss,(s.bossTitle||s.boss)+'Brief'];
      write('announceLabel',t(label,{n:data.id==='sector'?g.round+1:g.wave+1}));
      write('announceTitle',data.id==='wave'?t(s.waves[g.wave]?.name||'boss'):t(title,{n:g.wave+1}));
      write('announceBody',data.id==='wave'?t(s.waves[g.wave].name+'Brief'):data.id==='sector'?t(body)+' '+t(Swarm.variant(g).id):t(body));
    }
    hint.hidden=!g.tip||g.t>=g.tip.until||!!guide;
    if(!hint.hidden){
      const id=g.tip.id,value={move:displayMove(),key:forms.includes(id)?keyLabel(id):''};
      write('hint',t(touchInput&&id==='move'?'tipTouch':'tip'+cap(id),value));
    }
  }
  function hud(){
    const p=g.player,boss=g.enemies.find(e=>e.boss),view=FlightRender.camera(g);root.dataset.hud=(p.x-view.x)/view.w<.4&&(p.y-view.y)/view.h<.17?'clear':'normal';root.dataset.utility=(p.x-view.x)/view.w>.8&&(p.y-view.y)/view.h<.17?'clear':'normal';
    const screen=o=>({x:(o.x-view.x)/view.w,y:(o.y-view.y)/view.h});
    const underDock=o=>{const s=screen(o);return s.x>.25&&s.x<.75&&s.y>.83;};
    root.dataset.dock=underDock(p)||g.enemies.some(e=>e.hp>0&&underDock(e))?'clear':'normal';
    const underBanner=o=>{const s=screen(o);return s.x>.28&&s.x<.72&&s.y>.07&&s.y<.25;};
    root.dataset.announcement=underBanner(p)||g.enemies.some(e=>e.hp>0&&underBanner(e))?'clear':'normal';
    write('clock',clock(g.t));write('operation',t(g.kind)+(g.kind==='training'?'':' / '+pad(g.round+1,2)));
    write('sectorName',zoneName());write('objective',objective());
    $('wavePips').hidden=g.kind==='training'||g.kind==='rush';
    const duration=g.kind==='training'?0:Swarm.waveDuration(g);
    $('waveTrack').hidden=!duration;
    if(duration)$('waveFill').style.transform=scale(g.t-g.waveStart,duration);
    [...$('wavePips').children].forEach((el,i)=>{el.className=i===g.wave?'now':i<g.wave?'past':'';});
    $('boss').hidden=!boss;
    if(boss){
      write('bossName',t(Swarm.sector(g).bossTitle||boss.type));write('bossPhase',t(Swarm.exposed(g,boss)?'exposed':boss.hp<boss.max*.5?'enraged':'shielded'));
      $('bossFill').style.transform=scale(boss.hp,boss.max);
    }
    write('hullNumber',Math.round(p.hp)+' / '+p.max);
    $('hullFill').style.transform=scale(p.hp,p.max);
    $('hullFill').style.background=p.hp/p.max<=.3?'#ff887f':'';root.dataset.hull=p.hp/p.max<=.3?'critical':'stable';
    write('droneCount',pad(g.drones,3));
    $('droneCount').title=t('swarmCapacity',{n:Swarm.capacity(g)});
    write('fabrication',g.drones>=Swarm.capacity(g)?t('atCapacity'):t('fabrication',{parts:g.parts,cost:Swarm.fabricationCost(g)}));$('fabrication').title=t('fabricationHelp');write('score',pad(g.score,6));
    const chain=Swarm.multiplier(g);
    $('chain').hidden=chain===1;if(chain>1)write('chain',t('chain',{n:chain}));
    $('support').hidden=!g.relay&&!g.repair;
    write('support',[g.relay?t('relayName'):'',g.repair?t('medicName'):''].filter(Boolean).join(' · '));
    tacticalHud();announcementHud();
    const cost=Swarm.burstCost(g),ready=g.charge>=100&&g.drones>cost;
    for(const [i,id] of forms.entries()){
      const {b,status,charge}=formNodes[id];
      const burst=id==='burst',active=g.mode===id,available=burst?ready:i<g.unlocked,advised=guide?.mode===id;
      const name='formation'+(!available?' locked':'')+(active?' active':'')+(advised&&!active?' recommended':'')+(burst&&ready?' burst-ready':'');
      if(b.className!==name)b.className=name;
      b.disabled=g.bossDefeated;b.setAttribute('aria-disabled',String(!available||g.bossDefeated));
      if(!burst)b.setAttribute('aria-pressed',String(active));
      const value=burst?(ready?t('ready'):g.charge>=100?t('needsDrones',{n:cost+1}):t('charge',{n:g.charge})):
        advised?t(active?'countering':'counter'):active?t('active'):available?t('ready'):t(id==='spear'?'lockedSpear':'lockedBlades');
      if(status.textContent!==value)status.textContent=value;
      b.title=t(id+'Desc',{n:cost});
      if(charge)charge.style.transform=scale(g.charge,100);
    }
  }

  function stick(x=0,y=0){
    const magnitude=Math.min(1,Math.hypot(x,y));
    if(magnitude<.20)return null;
    const v=(magnitude-.20)/.80,scale=v/Math.hypot(x,y);
    return {x:x*scale,y:y*scale};
  }
  function gamepad(){
    let input;
    try{input=Array.from(globalThis.navigator?.getGamepads?.()||[]).find(p=>p&&p.connected!==false&&p.mapping==='standard');}
    catch{}
    if(!input){padButtons=[];padIndex=null;padAimAngle=null;return null;}
    if(input.index!==padIndex){padIndex=input.index;padButtons=[];padAimAngle=null;}
    const pressed=input.buttons.map(b=>!!b.pressed),tap=i=>pressed[i]&&!padButtons[i];
    const start=tap(9),cancel=tap(1);
    let move=null,steer=null;
    if(page==='playing'){
      const stickAim=stick(input.axes[2],input.axes[3]);
      if(stickAim){
        padAimAngle=Math.atan2(stickAim.y,stickAim.x);
      }
      if(padAimAngle!==null){const p=g.player;steer={x:p.x+Math.cos(padAimAngle)*180,y:p.y+Math.sin(padAimAngle)*180};}
      move=stick(input.axes[0],input.axes[1]);
      if(start)pause();
      else if(tap(14))command('ring');
      else if(tap(12))command('spear');
      else if(tap(15))command('blades');
      else if(tap(4))cycle(-1);
      else if(tap(5))cycle(1);
      else if(tap(0))command('burst',steer||aim);
    }else if(start&&page==='paused')resume();
    else if(cancel)back();
    else if(screens[page]){
      const choices=[...($(screens[page]).querySelectorAll?.('button')||[])].filter(b=>!b.hidden&&!b.disabled);
      const i=choices.indexOf(document.activeElement);
      if(choices.length&&(tap(12)||tap(13)||tap(14)||tap(15))){
        const direction=tap(12)||tap(14)?-1:1;
        choices[(i<0?0:(i+direction+choices.length)%choices.length)].focus({preventScroll:true});
      }else if(tap(0)&&choices.length){
        const current=choices[i]||(page==='menu'?(latestCheckpoint()?$('continueRun'):$('campaign')):choices[0]);
        current.click();
      }
    }
    padButtons=pressed;
    return {move,steer,fire:pressed[7]||pressed[6]};
  }

  function drain(){
    if(!g.cues.length)return;
    for(const id of new Set(g.cues))sound.cue(id);
    g.cues.length=0;
  }
  function frame(ms){
    const dt=previous===null?0:Math.max(0,Math.min(.083,(ms-previous)/1000));
    previous=ms;
    if(!toast.hidden&&ms>toastUntil)toast.hidden=true;
    const pad=gamepad();
    if(aimPoint)aim=FlightRender.project(FlightRender.camera(g),aimPoint.x,aimPoint.y);
    const steer=pad?.steer||aim;
    if(page==='playing'){
      let x=0,y=0;
      if(keys.size){
        const down=new Set(Array.from(keys,k=>bindings.action(k)));
        x=Number(down.has('right'))-Number(down.has('left'));
        y=Number(down.has('down'))-Number(down.has('up'));
      }
      if(pad?.move&&!x&&!y){x=pad.move.x;y=pad.move.y;}
      if(moveTouch){
        const dx=moveTouch.to.x-moveTouch.from.x,dy=moveTouch.to.y-moveTouch.from.y,n=Math.max(34,Math.hypot(dx,dy));
        x=dx/n;y=dy/n;
      }
      carry+=dt;let stepped=false;
      while(carry>=1/60&&g.phase==='playing'){
        Swarm.step(g,{x,y,aim:releasePending||steer,fire:!releasePending&&!!steer&&(firing||pad?.fire),release:!!releasePending});
        releasePending=null;carry-=1/60;stepped=true;
      }
      if(clearAimAfterRelease&&stepped){aim=null;aimPoint=null;clearAimAfterRelease=false;}
      const arriving=g.wave>=Swarm.sector(g).waves.length&&!g.bossSpawned;
      const nextGuide=settings.guide&&g.kind!=='training'&&!arriving&&!g.bossDefeated?adviser(g):null;
      const changed=nextGuide?.reason!==guide?.reason;
      guide=nextGuide;
      drain();
      if(g.phase==='transit'){mapTransit=true;selectedChapter=g.round;show('map');}
      else if(g.phase==='draft')show('draft');
      else if(g.phase!=='playing'){recordResult();show('debrief');}
      else if(changed||ms-lastHud>95){hud();lastHud=ms;}
    }
    const menu=page==='menu'||page==='records'||page==='map'||page==='changelog'||(page==='options'||page==='bindings')&&optionsFrom==='menu'||
      page==='manual'&&manualFrom==='menu';
    const reduced=settings.reduced;
    const flash=page==='playing'?Math.max(0,(g.hurtFlash-g.t)/.38)*(reduced?.21:1):0;
    $('hurt').style.opacity=flash;
    if(drawDirty||page==='playing'||menu&&!reduced&&ms-lastDraw>=32){
      renderer.draw(g,{edgeBeamLabel:t('edgeBeam'),edgeRingLabel:t('edgeRing'),hullLabel:t('hull'),weaponLabel:t('status'+cap(g.mode),{n:g.mode==='ring'?g.weapon.guard:g.mode==='spear'?Math.floor(g.weapon.lock*100):(1+g.weapon.spin*.8).toFixed(1)}),menu,reduced,wall:ms/1000,dt,frozen:page!=='playing',inspect:inspecting,guide,keyLabel,aim:steer,touch:moveTouch?{
        from:FlightRender.project(FlightRender.camera(g),moveTouch.from.x/Math.max(1,canvas.getBoundingClientRect().width),moveTouch.from.y/Math.max(1,canvas.getBoundingClientRect().height)),
        to:FlightRender.project(FlightRender.camera(g),moveTouch.to.x/Math.max(1,canvas.getBoundingClientRect().width),moveTouch.to.y/Math.max(1,canvas.getBoundingClientRect().height))
      }:null});
      drawDirty=false;lastDraw=ms;
    }
    sound.tick(g.round,page==='playing'&&(g.bossSpawned||g.enemies.length>10),page==='playing'||menu,page==='playing'?g.t:ms/1000,page==='playing'?g.sectorStart:0);
    requestAnimationFrame(frame);
  }
  if(typeof ResizeObserver==='function')new ResizeObserver(resize).observe(canvas);
  addEventListener('resize',resize);
  resize();sound.configure(settings);controlsHud();show('menu',true);requestAnimationFrame(frame);
})();
</script>
</body>
</html>
